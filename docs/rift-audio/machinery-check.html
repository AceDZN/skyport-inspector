<!doctype html><meta charset="utf-8"><title>Rift Runner campaign audio lab</title><style>body{font:17px system-ui;background:#edf0e8;color:#25343a;margin:28px}button,input,select{margin:5px;padding:10px}button{background:#303942;color:white;border:0;border-radius:5px}pre{white-space:pre-wrap;font-size:13px}.gains{display:flex;flex-wrap:wrap;gap:12px}.gains label{display:grid}h1{margin:0}</style>
<h1>Rift Runner · Campaign machinery audio</h1><p>One original score, with subtle chapter/intensity variations and distinct tactile machinery.</p><button id="start">Start</button><button id="pause">Pause</button><button id="resume">Resume</button><button id="all">All 11 machinery sounds</button><button id="mute">Master mute</button><label>Chapter<select id="chapter"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label><label>Intensity<input id="intensity" type="range" min="0" max="1" step=".01" value="0"></label><div class="gains" id="gains"></div><pre id="state"></pre>
<script type="module">
import {RiftAudio} from '../../src/audio.ts';const $=id=>document.getElementById(id);window.audio=new RiftAudio();
$('start').onclick=()=>audio.start();$('pause').onclick=()=>audio.setPaused(true);$('resume').onclick=()=>audio.setPaused(false);$('mute').onclick=()=>audio.setGain('master',0);$('chapter').onchange=e=>audio.setChapter(Number(e.target.value),Number($('intensity').value));$('intensity').oninput=e=>audio.setIntensity(Number(e.target.value));
$('all').onclick=()=>['switch-toggle','shutter-open','shutter-close','lift-motor','lift-arrival','conveyor-clutch','platform-move','junction-rotate','relay-align','beam-blocked','receiver-power'].forEach((name,i)=>setTimeout(()=>audio.cue(name,(i%3-1)*.4),i*550));
$('gains').innerHTML=Object.entries(audio.settings()).map(([name,value])=>`<label>${name}<input type="range" data-bus="${name}" min="0" max="1" step=".01" value="${value}"></label>`).join('');$('gains').oninput=e=>audio.setGain(e.target.dataset.bus,Number(e.target.value));setInterval(()=>$('state').textContent=JSON.stringify(audio.state(),null,2),150);
</script>
