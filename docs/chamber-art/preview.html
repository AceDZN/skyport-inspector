<!doctype html><html><head><meta charset="utf-8"><title>Chamber art harness — unplayed</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10151a}canvas{display:block;width:100%;height:100%;outline:none}aside{position:absolute;left:20px;top:18px;color:#adbcc3;font:11px Arial;letter-spacing:1.8px;pointer-events:none}i{position:absolute;left:50%;top:50%;width:4px;height:4px;border:1px solid #c6d2d8;border-radius:50%;pointer-events:none}</style></head><body><canvas id="world" tabindex="0"></canvas><aside>ART LIGHTING HARNESS · UNPLAYED</aside><i></i><script type="module">
import {CoreWorld,initializePhysics}from'/src/core/world.ts';import{ChamberScene}from'/src/chamber-scene.ts';
await initializePhysics();const n=Number(new URL(location.href).searchParams.get('chamber'))===2?2:1,world=new CoreWorld(n),canvas=document.querySelector('canvas'),scene=new ChamberScene(canvas,world),keys=new Set();canvas.focus();
addEventListener('keydown',e=>{keys.add(e.code);if(e.code==='KeyE')world.grabDrop();if(e.code==='Digit1'||e.code==='Digit2'){const hit=scene.aim();if(hit?.surface)world.place(e.code==='Digit1'?0:1,hit.surface,hit.point);}e.preventDefault();});addEventListener('keyup',e=>keys.delete(e.code));
let drag;canvas.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId);});canvas.addEventListener('pointermove',e=>{if(drag){world.yaw-=(e.clientX-drag[0])*.0022;world.pitch=Math.max(-1.25,Math.min(1.25,world.pitch-(e.clientY-drag[1])*.0022));drag=[e.clientX,e.clientY];}});canvas.addEventListener('pointerup',()=>drag=undefined);
function step(ms){for(let left=Math.min(ms/1000,8);left>0;){const dt=Math.min(1/120,left);world.yaw+=((keys.has('KeyJ')?1:0)-(keys.has('KeyL')?1:0))*dt*1.5;world.pitch=Math.max(-1.25,Math.min(1.25,world.pitch+((keys.has('KeyI')?1:0)-(keys.has('KeyK')?1:0))*dt*1.2));world.step(dt,{forward:(keys.has('KeyW')?1:0)-(keys.has('KeyS')?1:0),strafe:(keys.has('KeyD')?1:0)-(keys.has('KeyA')?1:0),jump:keys.has('Space')});left-=dt;}}
let last=performance.now();function frame(t){step(Math.min(30,t-last));last=t;scene.update(.016);requestAnimationFrame(frame);}requestAnimationFrame(frame);window.render_game_to_text=()=>JSON.stringify({status:'Art harness only, no completion evidence',world:world.snapshot(),renderer:{calls:scene.renderer.info.render.calls,triangles:scene.renderer.info.render.triangles}});window.advanceTime=ms=>{step(ms);scene.update(0);};
</script></body></html>
