<!doctype html><html lang="en"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rift machinery — isolated visual proof</title><style>body{margin:0;overflow:hidden;background:#182b31;font:13px Arial;color:#f3ead4}canvas{display:block}aside{position:absolute;top:14px;left:14px;max-width:310px;background:#17323bea;padding:14px;line-height:1.6}button{background:#e0c897;color:#1c353b;border:0;padding:8px;margin:3px;cursor:pointer}button:focus-visible{outline:3px solid #b492ff}h1{font-size:18px;margin:0 0 7px}pre{white-space:pre-wrap;font-size:11px}footer{position:absolute;bottom:10px;left:16px;background:#17323bdf;padding:8px}</style><canvas id="proof"></canvas><aside><h1>Original machinery proof</h1>Isolated renderer, not gameplay or campaign completion.<br><button id="switch">Flip main lever</button><button id="lift">Select lift stop</button><button id="reverse">Reverse conveyor</button><button id="junction">Turn junction</button><button id="relay">Aim relay</button><button id="block">Block beam</button><button id="pause">Pause motion</button><button id="rebuild">Dispose + rebuild</button><hr><button data-view="all">Overview</button><button data-view="front">Lift / shutter</button><button data-view="back">Relay / junction</button><pre id="state"></pre></aside><footer id="stats"></footer><script type="module">
import * as T from 'three';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {MachineSystems} from '/src/systems.ts';
import {MachineryVisuals} from '/src/machinery-visuals.ts';
const renderer=new T.WebGLRenderer({canvas:document.querySelector('#proof'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1;
const scene=new T.Scene();scene.background=new T.Color('#b9d3d5');scene.add(new T.HemisphereLight(0xe4f2ff,0x8a8163,1.2));const sun=new T.DirectionalLight(0xffdfac,3.4);sun.position.set(-7,14,9);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-14,right:14,top:14,bottom:-14});scene.add(sun);const pmrem=new T.PMREMGenerator(renderer);scene.environment=pmrem.fromScene(new RoomEnvironment(),.04).texture;scene.environmentIntensity=.4;pmrem.dispose();
const floor=new T.Mesh(new T.BoxGeometry(28,.25,25),new T.MeshStandardMaterial({color:0xb8b8a9,roughness:.85}));floor.position.set(0,-.4,-2);floor.receiveShadow=true;scene.add(floor);const root=new T.Group();scene.add(root);
const specs=[{id:'power',kind:'switch',label:'MAIN CIRCUIT',position:[-6,.9,3],size:[.7,1.4,.55]},{id:'door',kind:'shutter',label:'GALLERY SHUTTER',position:[-2,1.4,3],size:[2.4,2.8,.25],circuit:{all:['power']}},{id:'lift',kind:'lift',label:'NORTH LIFT',position:[3,.15,3],size:[2.8,.3,2.4],stops:[{label:'LOW',position:[3,.15,3]},{label:'MIDDLE',position:[3,1.8,3]},{label:'UPPER',position:[3,3.4,3]}]},{id:'reverse',kind:'switch',label:'BELT DIRECTION',position:[-7,.9,-3],size:[.65,1.2,.5]},{id:'belt',kind:'conveyor',label:'CARGO LINE',position:[-3,.05,-3],size:[5,.4,1.8],direction:[1,0,0],speed:1.4,circuit:{all:['power']},controls:'reverse'},{id:'hub',kind:'junction',label:'BRIDGE JUNCTION',position:[3,.05,-3],size:[4.2,.3,1.7],angles:[0,Math.PI/2,Math.PI],states:['EAST','NORTH','WEST']},{id:'ferry',kind:'moving-platform',label:'CANAL FERRY',position:[8,.05,-7],target:[8,.05,-1],size:[2.4,.3,2],period:7},{id:'prism',kind:'relay',label:'GARDEN RELAY',position:[-4,1,-7],size:[.8,1.5,.8],states:['LOW RECEIVER','HIGH RECEIVER'],receivers:[{id:'low',position:[0,1,-7]},{id:'high',position:[0,3,-7]}]},{id:'low',kind:'receiver',label:'LOW RECEIVER',position:[0,1,-7],size:[.6,.6,.2]},{id:'high',kind:'receiver',label:'HIGH RECEIVER',position:[0,3,-7],size:[.6,.6,.2]}];
const systems=new MachineSystems(specs);let visuals=new MachineryVisuals(root,systems),paused=false,blocked=false;const blocker=new T.Mesh(new T.BoxGeometry(.3,2,.8),new T.MeshStandardMaterial({color:0x555f62}));blocker.position.set(-2,1,-7);blocker.visible=false;scene.add(blocker);const blockerBox=new T.Box3().setFromObject(blocker);
const camera=new T.PerspectiveCamera(48,innerWidth/innerHeight,.1,100);const views={all:[[14,12,20],[0,.7,-1]],front:[[8,7,13],[-1,1.4,3]],back:[[5,5,0],[-2,1.3,-6]]};function view(name){camera.position.fromArray(views[name][0]);camera.lookAt(new T.Vector3(...views[name][1]));}view('all');document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>view(b.dataset.view));
for(const [button,id]of[['switch','power'],['reverse','reverse'],['lift','lift'],['junction','hub'],['relay','prism']])document.getElementById(button).onclick=()=>systems.interact(id);document.querySelector('#block').onclick=()=>{blocked=!blocked;blocker.visible=blocked};document.querySelector('#pause').onclick=()=>{paused=!paused};document.querySelector('#rebuild').onclick=()=>{visuals.dispose();visuals=new MachineryVisuals(root,systems);};
let before=performance.now(),timer=0;function frame(now){const dt=Math.min(.04,(now-before)/1000);before=now;if(!paused)systems.update(dt,[],{},blocked?[blockerBox]:[]);visuals.update(paused?0:dt);renderer.render(scene,camera);timer+=dt;if(timer>.3){timer=0;document.querySelector('#state').textContent=systems.snapshot().map(d=>`${d.label}: ${d.blocked?'BLOCKED':d.kind==='relay'?(d.powered??'IDLE'):['switch','shutter','conveyor'].includes(d.kind)?(d.active?'ON':'OFF'):d.choice}`).join('\n');document.querySelector('#stats').textContent=`GPU geometries ${renderer.info.memory.geometries} · textures ${renderer.info.memory.textures} · calls ${renderer.info.render.calls} · lift E anchor ${visuals.controlAnchors.get('lift').toArray().map(v=>v.toFixed(2)).join(', ')}`;}requestAnimationFrame(frame);}requestAnimationFrame(frame);addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});
</script></html>
